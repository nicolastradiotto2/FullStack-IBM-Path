<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Blog di Nicola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">📰 Blog di Nicola</h1>

        {% if posts %}
            <div class="list-group">
                {% for post in posts %}
                    <a href="#" class="list-group-item list-group-item-action">
                        <h5 class="mb-1">{{ post.titolo }}</h5>
                        <p class="mb-1">{{ post.contenuto|truncatechars:150 }}</p>
                        <small>Pubblicato il {{ post.data_creazione|date:"d/m/Y H:i" }}</small>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center text-muted">Nessun post disponibile</p>
        {% endif %}
    </div>
</body>
</html>
